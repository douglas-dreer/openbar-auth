name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: write
  pull-requests: write
  checks: write

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Job 1: Build & Test
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openbar_auth
          POSTGRES_USER: openbar
          POSTGRES_PASSWORD: openbar123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/test/'
          retention-days: 7

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: '**/build/libs/*.jar'
          retention-days: 7

  # ============================================
  # Job 2: Code Quality (SonarQube)
  # ============================================
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openbar_auth
          POSTGRES_USER: openbar
          POSTGRES_PASSWORD: openbar123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with tests (for coverage)
        run: ./gradlew build

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew :openbar-auth:sonar \
            -Dsonar.host.url=${{ secrets.SONAR_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: SonarQube Quality Gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
              "${{ secrets.SONAR_URL }}/api/qualitygates/project_status?projectKey=${{ secrets.SONAR_PROJECT_KEY }}" \
              | jq -r '.projectStatus.status')
            if [ "$STATUS" = "OK" ] || [ "$STATUS" = "ERROR" ]; then
              echo "Quality Gate: $STATUS"
              if [ "$STATUS" = "ERROR" ]; then exit 1; fi
              exit 0
            fi
            echo "Waiting for analysis... ($i/30)"
            sleep 10
          done
          echo "Timeout waiting for Quality Gate"
          exit 1
        continue-on-error: true

  # ============================================
  # Job 3: Docker Build
  # ============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: |
          docker build -f openbar-auth/Dockerfile -t openbar-auth:latest .
          docker build -f openbar-auth/Dockerfile -t openbar-auth:${{ github.sha }} .

  # ============================================
  # Job 4: Postman Tests
  # ============================================
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    continue-on-error: true

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: openbar_auth
          POSTGRES_USER: openbar
          POSTGRES_PASSWORD: openbar123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run openbar-auth
        run: |
          ./gradlew :openbar-auth:bootRun &
          sleep 30
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_NAME: openbar_auth
          DB_USERNAME: openbar
          DB_PASSWORD: openbar123

      - name: Run Postman tests
        run: |
          npm install -g newman
          newman run postman/openbar-auth.postman_collection.json \
            --environment postman/openbar-auth.postman_environment.json \
            --reporters cli
