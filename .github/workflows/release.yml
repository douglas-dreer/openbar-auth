name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Job 1: Build & Test
  # ============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Run tests
        run: ./gradlew test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/test/'
          retention-days: 7

  # ============================================
  # Job 2: Docker Build & Push
  # ============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          TAG="${{ steps.tag.outputs.tag }}"
          IMAGE="ghcr.io/${{ github.repository }}/openbar-auth"

          docker build -f openbar-auth/Dockerfile \
            -t "$IMAGE:$TAG" \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:latest" \
            .

          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"

  # ============================================
  # Job 3: GitHub Release
  # ============================================
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.tag.outputs.version }}"

          # Try to extract section from CHANGELOG.md
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk "/^## \\[$VERSION\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          fi

          if [ -z "$NOTES" ]; then
            NOTES="Release v${VERSION}"
          fi

          # Write to file for multi-line output
          echo "$NOTES" > /tmp/release-notes.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: /tmp/release-notes.txt
          draft: false
          prerelease: false

  # ============================================
  # Job 4: Sync version back to develop
  # ============================================
  sync-develop:
    name: Sync to Develop
    runs-on: ubuntu-latest
    needs: release
    timeout-minutes: 10

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Add [Unreleased] section to CHANGELOG.md
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          CHANGELOG="CHANGELOG.md"

          if [ ! -f "$CHANGELOG" ]; then
            exit 0
          fi

          # Add a new [Unreleased] section after the header but before the first version section
          if ! grep -q "^## \[Unreleased\]" "$CHANGELOG"; then
            # Insert after the preamble (after first blank line following header)
            awk -v ver="$VERSION" '
              /^## \[/ && !done {
                print "## [Unreleased]\n"
                print "### Added\n"
                print "- ...\n"
                done=1
              }
              { print }
              END {
                if (!done) {
                  print "## [Unreleased]\n"
                  print "### Added\n"
                  print "- ...\n"
                }
              }
            ' "$CHANGELOG" > /tmp/changelog.tmp
            mv /tmp/changelog.tmp "$CHANGELOG"
          fi

      - name: Create PR to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          BRANCH="sync/unreleased-after-v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Check if there are changes
          if git diff --quiet; then
            echo "No changes needed on develop."
            exit 0
          fi

          git checkout -b "$BRANCH"
          git add CHANGELOG.md
          git commit -m "chore: add [Unreleased] section after v${VERSION} release"
          git push origin "$BRANCH"

          # Check if PR already exists
          EXISTING_PR=$(gh pr list \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists."
            exit 0
          fi

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore: sync [Unreleased] after v${VERSION}" \
            --body \
              "## Post-release sync

          Adds \`[Unreleased]\` section back to \`CHANGELOG.md\` on \`develop\` after the \`v${VERSION}\` release.

          ---" \
            --label "chore"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Sync to Develop" >> "$GITHUB_STEP_SUMMARY"
          echo "Created PR to restore \`[Unreleased]\` section on \`develop\`." >> "$GITHUB_STEP_SUMMARY"
