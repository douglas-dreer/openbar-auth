spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/openbar_pm
    driver-class-name: org.postgresql.Driver
    username: openbar
    password: openbar123

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.openbar.pm: DEBUG
